[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "majorcs2-previsor"
version = "0.1.0"
description = "Previsor do PGL Major Singapore 2026 de CS2"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow"]

[project.scripts]
predict_stage2 = "sim.predict_stage2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
